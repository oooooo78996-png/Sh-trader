name: Extract SH TRADER

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/project
          unzip -o SH_TRADER_project.zip -d /tmp/project
          cp -a /tmp/project/. .

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git restore --staged .github/workflows/build-apk.yml || true

          git diff --cached --quiet || git commit -m "Extract SH TRADER project"

          git push
